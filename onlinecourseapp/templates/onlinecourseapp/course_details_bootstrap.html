<h2>{{ course.name }}</h2>

<p>{{ course.description }}</p>

<h3>Lessons</h3>

{% for lesson in course.lesson_set.all %}
    <div class="card mb-3">
        <div class="card-body">
            <h5>{{ lesson.title }}</h5>
            <p>{{ lesson.content }}</p>
        </div>
    </div>
{% empty %}
    <p>No lessons available.</p>
{% endfor %}
